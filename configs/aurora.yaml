name: aurora_baseline
defaults: 
  - hydra: default # load default hydra settings
  - wandb: default # load default wandb settings
  - env: kheperax # load environment settings
  - _self_

seed: 42
backend: jax

# QD settings
batch_size: 512
num_iterations: 2000
num_total_steps: 2_000_000 # num_total_evals * episode_length

metrics_log_period: 5
# Log descriptor-space geometry (bbox / diameter / PCA volume + repertoire d_min) into metrics.csv
log_answer_set_geometry: true
me_repertoire: false

# Emitter settings
iso_sigma: 0.005
line_sigma: 0.05

# AURORA settings
reinit_params: false
reinit_opt: true
no_csc: false
no_training: false
csc_orig: false

repertoire: "adaptive" # "adaptive" or "threshold"
max_size: 1024 
target_size: 922 # 0.9*max_size
l_value_init: 0.2
prop_gain: 1e-4
default_update_base: 10

# Encoder settings
model_batch_size: 128
hidden_size: 10
features: 8 # only used for AutoEncoder for image obs
model_epoch_period: 200
learning_rate: 1e-2
min_delta_early_stopping: 0.0005

loss_type: 'mse' # 'mse', 'both' or 'triplet'
triplet_margin: 0.2
triplet_loss_weight: 1
margin_auto_adjust: true

# Extinction settings
extinction: false
extinction_freq: 10
remaining_prop: 0.05
post_extinction_snapshot_offset: 5

top_k_percent: 20
extinction_mode: "off"   # "off" | "static" | "fitness_trigger" | "d_min_trigger" | "static_ramped_proportion"

adaptive_extinction:
  warmup: 50    # outer iterations before trigger is eligible
  patience: 10  # recent window size (outer iterations)
  alpha: 0.2    # recent_rate / historical_rate threshold
  cooldown: 10  # outer iterations after an extinction before re-trigger

  # d_min volatility trigger params
  d_min_patience: 10   # recent window (outer iterations)
  d_min_alpha: 0.2     # recent_vol / historical_vol threshold
  d_min_warmup: 50     # outer iterations before eligible
  d_min_cooldown: 10   # outer iterations after an extinction before re-trigger

  # hybrid d_min_trigger (stagnation + top-k fitness + emergency high d_min)
  d_min_window: 15
  fitness_window: 15
  d_min_stagnation_threshold: 0.01
  fitness_improvement_threshold: 0.02
  high_d_min_threshold: 0.95
  high_d_min_patience: 30
  fitness_patience: 10

  # ramped proportion params (used by static_ramped_proportion mode)
  ramped_prop_min: 0.05
  ramped_prop_max: 0.40

env_params:
  kheperax:
    iso_sigma: 0.2
    line_sigma: 0
  ant_maze:
    iso_sigma: 0.005
    line_sigma: 0.05
  walker:
    iso_sigma: 0.005
    line_sigma: 0.05
  half_cheetah:
    iso_sigma: 0.005
    line_sigma: 0.05

wandb: 
  group: ${env.name}
  tags: ['${name}', '${env.name}']